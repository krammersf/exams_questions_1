<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
  <title>Exams | ExamQuestions</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="exams-page">
  <main class="exams-page-container">
    <h1>Exams</h1>
    <p class="exams-intro">Select a certification or an exam to see the current number of questions.</p>

    <div class="exam-filters">
      <div>
        <label for="examsProviderDisplay">Certification:</label>
        <div class="custom-select" id="examsProviderSelect">
          <div class="select-display" id="examsProviderDisplay">-- Choose an option --</div>
          <div class="select-options" id="examsProviderOptions"></div>
        </div>
      </div>
      <div class="exam-actions">
        <button type="button" id="clearExamFilter">Clear</button>
        <a href="index.html" class="back-button">⬅ Back</a>
      </div>
    </div>

    <div id="examList" class="exam-list" aria-live="polite">
      <p class="empty-exams">Loading exams...</p>
    </div>

  </main>

  <script>
    const providerSelect = document.getElementById('examsProviderSelect');
    const providerDisplay = document.getElementById('examsProviderDisplay');
    const providerOptions = document.getElementById('examsProviderOptions');
    const clearExamFilter = document.getElementById('clearExamFilter');
    const examList = document.getElementById('examList');
    let providers = [];
    let selectedProvider = '';
    const examOrderStateKey = 'examOrderState';

    function getExamOrderState() {
      try {
        return JSON.parse(localStorage.getItem(examOrderStateKey)) || {};
      } catch (error) {
        console.error('Could not read exam order state', error);
        return {};
      }
    }

    function saveExamOrder(provider, exam) {
      const state = getExamOrderState();
      const key = `${provider}:${exam.value}`;
      const current = state[key] || {
        carregado: exam.carregado === true,
        contador: Number(exam.contador) || 0
      };

      state[key] = {
        carregado: true,
        contador: Number(current.contador) + 1
      };
      localStorage.setItem(examOrderStateKey, JSON.stringify(state));
    }

    function getExamStatus(provider, exam) {
      const state = getExamOrderState()[`${provider}:${exam.value}`];
      return state || {
        carregado: exam.carregado === true,
        contador: Number(exam.contador) || 0
      };
    }

    function getProviderDisplayName(provider) {
      return provider === 'AWS' ? 'Amazon (AWS)' : provider;
    }

    function renderExams() {
      const providerName = selectedProvider;
      const visibleProviders = providers.filter(provider => provider.provider === providerName);
      const exams = visibleProviders.flatMap(provider => provider.exams.map(exam => ({
        ...exam,
        provider: provider.provider
      })));

      examList.innerHTML = exams.length
        ? exams.map(exam => {
              const [code, description] = exam.label.split(': ');
              const status = getExamStatus(exam.provider, exam);
            return `
            <div class="exam-row">
              <div>
                <strong>${exam.provider}</strong>
                <span class="exam-code">${code}</span>
                <span>${description || ''}</span>
              </div>
              <div class="exam-row-actions">
                <b>${exam.questions} questions</b>
                <a class="order-exam-button${status.carregado ? ' is-loaded' : ''}" href="index.html?provider=${encodeURIComponent(exam.provider)}&exam=${encodeURIComponent(exam.value)}" data-provider="${exam.provider}" data-exam-value="${exam.value}">
                  Order
                  ${status.carregado ? '<span class="order-status" aria-label="Already ordered">&#10003;</span>' : ''}
                </a>
              </div>
            </div>
          `;
          }).join('')
        : '<p class="empty-exams">No exams found.</p>';

      examList.querySelectorAll('.order-exam-button').forEach(button => {
        button.addEventListener('click', () => {
          const provider = button.dataset.provider;
          const exam = providers
            .find(item => item.provider === provider)
            ?.exams.find(item => item.value === button.dataset.examValue);
          if (exam) saveExamOrder(provider, exam);
        });
      });
    }

    async function loadExams() {
      try {
        const response = await fetch('subopcoes.json');
        if (!response.ok) throw new Error('Could not load exams');
        providers = await response.json();
        providers.forEach(provider => {
          provider.exams.forEach(exam => {
            exam.carregado = exam.carregado === true;
            exam.contador = Number(exam.contador) || 0;
          });
        });

        providers.forEach(provider => {
          const option = document.createElement('div');
          option.className = 'select-option';
          option.textContent = getProviderDisplayName(provider.provider);
          option.dataset.value = provider.provider;
          option.addEventListener('click', () => {
            selectedProvider = provider.provider;
            providerDisplay.textContent = provider.provider;
            providerOptions.style.display = 'none';
            renderExams();
          });
          providerOptions.appendChild(option);
        });
        providerDisplay.addEventListener('click', () => {
          providerOptions.style.display = providerOptions.style.display === 'block' ? 'none' : 'block';
        });
        renderExams();
      } catch (error) {
        console.error(error);
        examList.innerHTML = '<p class="empty-exams">Could not load exams.</p>';
      }
    }

    clearExamFilter.addEventListener('click', () => {
      selectedProvider = '';
      providerDisplay.textContent = '-- Choose an option --';
      providerOptions.style.display = 'none';
      renderExams();
    });
    document.addEventListener('click', event => {
      if (!providerSelect.contains(event.target)) {
        providerOptions.style.display = 'none';
      }
    });
    loadExams();
  </script>
</body>
</html>
