name: Update ServiceNow exam counts

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh ServiceNow question counts
        run: python3 refresh_servicenow_questions.py

      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subopcoes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ServiceNow exam question counts"
            git push
          fi
