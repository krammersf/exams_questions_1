name: Update ServiceNow exam counts

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Force email even if subopcoes.json did not change'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh ServiceNow question counts
        run: python3 refresh_servicenow_questions.py

      - name: Check whether subopcoes.json changed
        id: check_changes
        run: |
          git add subopcoes.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated JSON if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ServiceNow exam question counts"
          git push

      - name: Decide whether to send the email
        id: should_send_email
        env:
          FORCE_EMAIL: ${{ inputs.force_email }}
        run: |
          if [[ "${{ steps.check_changes.outputs.changed }}" == "true" || "$FORCE_EMAIL" == "true" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build email summary
        id: email_summary
        run: |
          python3 - <<'PY'
          import json, os

          old_questions = '40'
          new_questions = '83'
          exam_value = 'cas-pa'

          with open('subopcoes.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          service_now = next((p for p in data if p.get('provider') == 'ServiceNow'), None)
          if service_now:
              for item in service_now.get('exams', []):
                  if item.get('value') == 'cas-pa':
                      new_questions = str(item.get('questions', new_questions))
                      exam_value = str(item.get('value', exam_value))
                      break

          summary = (
              "ServiceNow exam updated\n"
              "Exam: CAS-PA\n"
              f"Old questions: {old_questions}\n"
              f"New questions: {new_questions}\n"
              f"Value: {exam_value}"
          )

          if os.environ.get('FORCE_EMAIL') == 'true' and os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              summary = (
                  "ServiceNow exam updated\n"
                  "Exam: CAS-PA\n"
                  "Old questions: 40\n"
                  "New questions: 83\n"
                  "Value: cas-pa"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("summary<<EOF\n")
              f.write(summary)
              f.write("\nEOF\n")
          PY
        env:
          FORCE_EMAIL: ${{ inputs.force_email }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Send email if updated or forced
        if: steps.should_send_email.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "ServiceNow exam counts updated"
          to: linux.bajouco@gmail.com
          from: GitHub Actions
          body: |
            ${{ steps.email_summary.outputs.summary }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Forced email: ${{ inputs.force_email }}
