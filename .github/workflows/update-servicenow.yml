name: Update ServiceNow exam counts

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Force email even if subopcoes.json did not change'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh ServiceNow question counts
        run: python3 refresh_servicenow_questions.py

      - name: Check whether subopcoes.json changed
        id: check_changes
        run: |
          git add subopcoes.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated JSON if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ServiceNow exam question counts"
          git push

      - name: Decide whether to send the email
        id: should_send_email
        env:
          FORCE_EMAIL: ${{ inputs.force_email }}
        run: |
          if [[ "${{ steps.check_changes.outputs.changed }}" == "true" || "$FORCE_EMAIL" == "true" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build email summary
        id: email_summary
        run: |
          python3 - <<'PY'
          import os, subprocess

          diff = subprocess.run(["git", "diff", "--", "subopcoes.json"], capture_output=True, text=True)
          content = diff.stdout.strip()

          if not content:
              summary = "Manual test: workflow was forced without a JSON change."
          else:
              lines = []
              for line in content.splitlines():
                  if line.startswith('+') and (
                      '"questions"' in line or '"label"' in line or '"value"' in line
                  ):
                      lines.append(line[1:].strip())
              if not lines:
                  summary = "ServiceNow data changed in subopcoes.json."
              else:
                  summary = "\n".join(lines[:12])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("summary<<EOF\n")
              f.write(summary)
              f.write("\nEOF\n")
          PY

      - name: Send email if updated or forced
        if: steps.should_send_email.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "ServiceNow exam counts updated"
          to: linux.bajouco@gmail.com
          from: GitHub Actions
          body: |
            Changed ServiceNow exam entry:

            ${{ steps.email_summary.outputs.summary }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Forced email: ${{ inputs.force_email }}
